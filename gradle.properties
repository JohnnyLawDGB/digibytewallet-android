android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The ABIs this app ships: exactly the ones the C core (:native, libcore-lib.so) is built for.
# :native builds these and :app packages only these, so a dependency that also carries 32-bit x86
# libraries (SQLCipher, Tor, CameraX, argon2, androidx.graphics.path) cannot put a lib/x86/ into
# the APK that lacks our own library. scripts/check-play-device-reach.sh checks the built APK.
wallet.nativeAbis=arm64-v8a,armeabi-v7a,x86_64
