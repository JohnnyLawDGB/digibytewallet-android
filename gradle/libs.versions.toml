# Gradle version catalog — single source of truth for dependency versions.
#
# Artifacts that MUST move in lockstep share one `[versions]` key, so a bump
# can never split a family across versions (e.g. hilt-android at 2.56.2 with
# hilt-android-compiler left at 2.55). Renovate targets these shared keys, so
# each family lands as one atomic PR — see renovate.json.
#
# Lockstep families: Compose (BOM), Hilt (plugin + runtime + compiler),
# androidx.hilt, Room, Lifecycle, CameraX, Coroutines, Kotlin (+ KSP), AGP.

[versions]

# --- Build tooling / plugins -------------------------------------------------
# AGP floor is set by KSP, not by Android: KSP 2.3.11 refuses AGP < 8.10.0
# (MINIMUM_SUPPORTED_AGP_VERSION; 2.3.12+ refuses < 8.12.0). AGP 8.10 needs
# Gradle 8.11.1+ (gradle/wrapper/gradle-wrapper.properties).
agp = "8.10.1"
# Kotlin 2.4.20 is the first stable release with the fix for GHSA-r937-wjx7-w2jp
# (kotlin-gradle-plugin). The Compose compiler plugin ships in the Kotlin release.
kotlin = "2.4.20"
# Since KSP 2.3.0 the version is NO LONGER Kotlin-derived (<kotlin>-<ksp>):
# KSP2 carries its own Analysis API and works across Kotlin releases. It must
# still be re-checked on every Kotlin bump. 2.3.10+ is required for Kotlin 2.4
# (google/ksp#2964: Kotlin 2.4's `{group}:{project}` module names broke Hilt
# factories for `internal` @Provides). 2.3.11 is the newest KSP that accepts
# AGP 8.10; 2.3.13 also has a concurrency regression (google/ksp#3286).
ksp = "2.3.11"
detekt = "1.23.8"

# --- Lockstep families -------------------------------------------------------
# Compose BOM pins every androidx.compose.* artifact; those libraries are
# declared below WITHOUT a version on purpose.
composeBom = "2024.12.01"
# com.google.dagger — Gradle plugin, runtime and KSP compiler all share this.
# 2.56.2 SHADES kotlin-metadata-jvm 2.1 and so cannot read Kotlin 2.4 class
# metadata; 2.57+ unshades it (raised to the Kotlin version in the root
# build.gradle.kts). 2.58 is the last line whose Gradle plugin accepts AGP 8:
# 2.59+ requires AGP 9 (and Gradle 9.1+).
hilt = "2.58"
# androidx.hilt — versioned independently of Dagger/Hilt above.
androidxHilt = "1.2.0"
room = "2.8.5"
lifecycle = "2.8.7"
camerax = "1.4.1"
coroutines = "1.11.0"

# --- Standalone libraries ----------------------------------------------------
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
coreKtx = "1.15.0"
browser = "1.8.0"
work = "2.9.1"
sqliteKtx = "2.4.0"
securityCrypto = "1.1.0-alpha06"
biometric = "1.1.0"
androidMaterial = "1.12.0"
okhttp = "4.12.0"
coil = "2.7.0"
zxingCore = "3.5.3"
zxingEmbedded = "4.3.0"
sqlcipher = "4.6.1"
argon2 = "13.1"
# kmp-tor runtime and its resource bundle version independently of each other.
kmpTorRuntime = "2.4.0"
kmpTorResource = "408.16.4"

# --- Test --------------------------------------------------------------------
junit = "4.13.2"
mockk = "1.14.11"
orgJson = "20260719"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]

# --- Compose (versions supplied by the BOM — do NOT add version.ref here) ----
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-text = { module = "androidx.compose.ui:ui-text" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# --- Activity + Navigation ---------------------------------------------------
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Lifecycle (lockstep) ----------------------------------------------------
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Hilt (lockstep) ---------------------------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

# --- Room (lockstep) ---------------------------------------------------------
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- CameraX (lockstep) ------------------------------------------------------
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# --- Other AndroidX ----------------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-sqlite-ktx = { module = "androidx.sqlite:sqlite-ktx", version.ref = "sqliteKtx" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# --- Third party -------------------------------------------------------------
android-material = { module = "com.google.android.material:material", version.ref = "androidMaterial" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }
argon2 = { module = "org.signal:argon2", version.ref = "argon2" }
kmp-tor-runtime = { module = "io.matthewnelson.kmp-tor:runtime", version.ref = "kmpTorRuntime" }
kmp-tor-resource-noexec = { module = "io.matthewnelson.kmp-tor:resource-noexec-tor", version.ref = "kmpTorResource" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# NOTE: net.zetetic:sqlcipher-android is consumed with the `@aar` artifact-only
# notation, which a catalog `module` coordinate cannot express (`@aar` also
# implies non-transitive resolution). It stays a string notation in
# core/build.gradle.kts, with only its VERSION sourced from `versions.sqlcipher`
# above, so Renovate still owns the number.

# --- Test --------------------------------------------------------------------
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
