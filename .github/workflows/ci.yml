name: CI
on:
  push:
    branches: [phase1-modernization, main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Lint
        run: ./gradlew lint || true  # Don't fail on lint warnings in alpha

      # A submodule pin that resolves LOCALLY proves nothing — the object is already in
      # the checkout. This asks the fork whether the pin is reachable from a durable
      # branch. Two real incidents in Aug 2026: a pin that had never been pushed at all
      # (surviving only in local worktrees), and four shipped releases whose pins existed
      # only on feature branches that could be deleted at any time.
      - name: Submodule pin is durable
        run: ./scripts/check-submodule-pin.sh

      # The digistamp section renders a third-party site in a WebView inside a wallet that
      # holds funds. That is defensible only because page JavaScript has NO channel into the
      # wallet — a page can navigate to a wallet URL, it cannot call a method. Adding a bridge
      # would swap "there is nothing to call" for "every argument is validated correctly",
      # which is a much weaker claim. Enforced rather than documented.
      - name: No WebView JavaScript bridge
        run: ./scripts/check-no-js-bridge.sh

      - name: Unit Tests
        run: ./gradlew testMainnetDebugUnitTest

      # ASan known-answer tests compiled against the live C submodule sources. These cover
      # memory safety and wire/protocol invariants the JVM tests structurally cannot reach:
      # NativeBridge's static initializer throws UnsatisfiedLinkError on a host JVM, so the
      # native layer is unmockable there. Nothing ran these before, and two had rotted into
      # a permanently broken state unnoticed.
      - name: Native host KATs
        run: ./scripts/run-host-kats.sh

      - name: Build Debug APK
        run: ./gradlew :app:assembleMainnetDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/mainnet/debug/*.apk
          retention-days: 30
