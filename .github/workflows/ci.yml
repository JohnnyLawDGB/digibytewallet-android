name: CI
on:
  push:
    branches: [phase1-modernization, main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Lint
        run: ./gradlew lint || true  # Don't fail on lint warnings in alpha

      - name: Unit Tests
        run: ./gradlew testMainnetDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :app:assembleMainnetDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/mainnet/debug/*.apk
          retention-days: 30
