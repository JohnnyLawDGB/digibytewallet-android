name: Release Build & Deploy

on:
  push:
    tags: ['v*']
  # Manual fallback. Without this the release is UNRECOVERABLE if a tag event is
  # missed: the workflow cannot be dispatched, so the only remedy is deleting and
  # re-pushing the tag and hoping. That happened on v4.0.33-beta — tag present on
  # the remote, workflow active, correct trigger at the tagged commit, and no run
  # was ever created. Pass the tag as `ref` to build it.
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-sign-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystores
        env:
          RELEASE_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          DEBUG_KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KS_B64" | base64 -d > app/release.jks
          printf '%s' "$DEBUG_KS_B64"   | base64 -d > /tmp/debug.keystore
          ls -la app/release.jks /tmp/debug.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: dgb-wallet-release
        run: ./gradlew :native:assembleMainnetRelease :app:assembleMainnetRelease

      # Rotate from the Android debug key (which signed every previously
      # distributed APK through v3.5.7) to the release key, using APK Signing
      # Scheme v3 lineage. What actually lands in the APK (verified with
      # `apksigner verify --verbose --print-certs` on the v4.0.77 and v4.0.78
      # release assets, 2026-09-03):
      #   v1 (JAR):  NOT present -- apksigner drops it once minSdk >= 24
      #   v2:        debug signer
      #   v3 / v3.1: debug signer for API 24-32, release signer for API 33+,
      #              lineage debug -> release with all capabilities
      # So existing installs upgrade in place everywhere we run: API 33+
      # sees the release cert, API 26-32 (minSdk 26) sees the debug cert it
      # was installed with, via v2/v3 -- there is no v1 signature involved.
      - name: Re-sign APK with debug→release signing lineage
        env:
          RELEASE_KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          DEBUG_KS_PW:   ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -e
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -rV | head -1)"
          APK="app/build/outputs/apk/mainnet/release/app-mainnet-release.apk"
          echo "Using $APKSIGNER"
          echo "APK: $APK"

          "$APKSIGNER" rotate \
              --out /tmp/lineage.bin \
              --old-signer \
                  --ks /tmp/debug.keystore \
                  --ks-key-alias androiddebugkey \
                  --ks-pass env:DEBUG_KS_PW \
                  --key-pass env:DEBUG_KS_PW \
              --new-signer \
                  --ks app/release.jks \
                  --ks-key-alias dgb-wallet-release \
                  --ks-pass env:RELEASE_KS_PW \
                  --key-pass env:RELEASE_KS_PW

          "$APKSIGNER" sign \
              --ks /tmp/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass env:DEBUG_KS_PW \
              --key-pass env:DEBUG_KS_PW \
              --next-signer \
                  --ks app/release.jks \
                  --ks-key-alias dgb-wallet-release \
                  --ks-pass env:RELEASE_KS_PW \
                  --key-pass env:RELEASE_KS_PW \
              --lineage /tmp/lineage.bin \
              "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -40

      - name: Compute SHA-256
        id: checksum
        run: |
          APK=$(find app/build/outputs/apk/mainnet/release -name '*.apk' | head -1)
          # Rename to versioned filename so the GitHub-release asset is
          # recognizable when users download it (previously it was always
          # app-mainnet-release.apk regardless of version).
          TAG="${GITHUB_REF#refs/tags/}"
          DIR=$(dirname "$APK")
          VERSIONED="$DIR/digibyte-wallet-${TAG}.apk"
          cp "$APK" "$VERSIONED"
          HASH=$(sha256sum "$VERSIONED" | cut -d' ' -f1)
          echo "apk_path=$VERSIONED" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $HASH"
          echo "Asset: digibyte-wallet-${TAG}.apk"

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The deobfuscation mapping for this exact build. Without it a crash report from a
      # user is undecodable, and it cannot be reconstructed from a shipped APK — so it has to
      # be captured at build time or it is gone. Kept as a workflow artifact rather than a
      # release asset: it is a debugging key, not something to hand out.
      - name: Archive R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.tag }}
          path: app/build/outputs/mapping/mainnetRelease/
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.checksum.outputs.apk_path }}
          body: |
            ${{ contains(github.ref_name, '-beta') && '## ⚠ BETA — please read before installing

            This build is published for testing. It contains substantial changes to how the
            wallet synchronises and has **not** completed the full acceptance cycle.

            **Use a wallet you can afford to lose access to, and keep your recovery phrase.**

            ### What is fixed in this build

            Sync was slow or never finished on some devices. Measured on a Samsung Galaxy Note 8
            (2017 hardware), a new wallet now reaches the chain tip in about 5 minutes:

            - New wallets scan ~59,000 blocks instead of ~299,000 — the bundled chain checkpoints
              had gone 50 days stale, so every new wallet re-scanned months of history it could
              not possibly have transactions in.
            - Filter processing is ~60x faster. The wallet was rebuilding its entire address set
              for every single block filter, and walking the whole block chain on every new block
              while freeing nothing.
            - A pacing mechanism could deadlock the scan permanently. Removed.
            - The wallet no longer reports "synced" while blocks remain unscanned. It previously
              could declare a final balance with ~60,000 blocks never checked for payments.
            - A new wallet no longer shows a false "scan for missing transactions" warning.
            - Peer connection churn reduced ~36x, and IPv6 peers are now handled correctly.

            ### Known issues and outstanding work

            - **Do not use Sweep if you hold DigiAssets or DigiDollar.** The sweep path is not
              asset-aware and will spend those outputs as plain DGB, destroying the asset. Use
              **Recover** instead, which is safe. An asset-aware migration is still to be built.
            - **Restoring a wallet with a long transaction history has not been verified in this
              cycle.** New-wallet sync is well tested; deep restore is not.
            - Interrupting a deep restore and resuming has not been re-verified.
            - Not yet tested on Android 15 / 16 KB page-size devices.
            - Some bundled peer nodes are unreachable and are being refreshed.
            - Advanced compact-filter back-pressure remains disabled pending the deep-restore
              acceptance run.

            Source, full commit history and issue tracker:
            https://github.com/JohnnyLawDGB/digibytewallet-android

            Please report anything you hit — logs and the device model help enormously.

            ---
            ' || '' }}
            **SHA-256:** `${{ steps.checksum.outputs.hash }}`

            Download from [digiscope.me/downloads/](https://digiscope.me/downloads/) or install the APK below. Requires Android 8.0+.

            Source: https://github.com/JohnnyLawDGB/digibytewallet-android
          prerelease: ${{ contains(github.ref_name, '-beta') }}

      # A security cycle is due every 10 releases. This blocks SHIPPING rather than every
      # build: development should not stop, but shipping is the point of pressure that actually
      # gets the review done. The previous arrangement — an agreed practice with no gate —
      # produced 52 releases without one. Deferring is allowed; record it in the log and move
      # the marker deliberately.
      - name: Security cycle is current
        run: ./scripts/check-security-cycle.sh

      - name: Deploy to VPS
        if: success()
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APK_PATH: ${{ steps.checksum.outputs.apk_path }}
          APK_HASH: ${{ steps.checksum.outputs.hash }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          FILENAME="digibyte-wallet-${TAG}.apk"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan digiscope.me >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key "$APK_PATH" "root@digiscope.me:/var/www/digiscope-downloads/${FILENAME}"

          ssh -i ~/.ssh/deploy_key root@digiscope.me bash -s "$TAG" "$FILENAME" "$APK_HASH" << 'DEPLOY'
            set -e
            TAG="$1"; FILENAME="$2"; HASH="$3"
            cd /var/www/digiscope-downloads

            # A PRERELEASE MUST NOT TOUCH THE STABLE CHANNEL.
            #
            # Until 2026-08-02 this whole block ran for every tag, so tagging
            # v4.0.31-beta / v4.0.32-beta rewrote the public download page and
            # repointed digibyte-wallet-latest.apk at a prerelease. Three ways it
            # broke, all observed live:
            #   1. VER_RE below is not suffix-aware, so in "v4.0.31-beta" it matched
            #      only "v4.0.31" and substituted the FULL tag -> "v4.0.32-beta-beta",
            #      compounding another "-beta" on every beta release. The resulting
            #      /releases/tag/ link 404s.
            #   2. The anchored patterns ("digibyte-wallet-${VER_RE}\.apk",
            #      "Download APK (${VER_RE})") then FAILED to match a suffixed
            #      filename at all, so the download button silently froze on an
            #      older beta...
            #   3. ...while the SHA-256 line (unanchored, matches any 64 hex chars)
            #      DID update. Page served v4.0.31-beta.apk beside v4.0.32-beta's
            #      checksum: anyone verifying the download would see a mismatch and
            #      reasonably conclude the APK had been tampered with. For a wallet
            #      that is the worst failure of the three.
            case "$TAG" in
              *-*) IS_PRERELEASE=1 ;;   # any suffix (-beta, -rc, ...) is not stable
              *)   IS_PRERELEASE=0 ;;
            esac

            if [ "$IS_PRERELEASE" = "1" ]; then
              # Beta channel only. index.html, the stable "latest" symlink and the
              # published SHA-256 all continue to describe the newest STABLE release.
              # Betas are reached through the in-app opt-in beta channel
              # (UpdateChecker ALL_URL) and this symlink, never the front page.
              ln -sf "/var/www/digiscope-downloads/${FILENAME}" digibyte-wallet-latest-beta.apk
              echo "prerelease ${TAG}: beta symlink updated; stable channel untouched"
            else

            # Scoped mechanical updates. Each regex is anchored to a specific UI
            # element so free-body-text version mentions (e.g. "upgrade from
            # v3.4.0" inside release notes) are never accidentally rewritten.
            # Release notes content itself stays as-committed in the tagged revision.
            # VER_RE tolerates -suffixes so that a stable release can always CLEAN UP
            # a page left mangled by an older workflow, rather than failing to match it.
            # The group REPEATS (*, not \?) on purpose: the live page was left reading
            # "v4.0.32-beta-beta", and a single optional suffix matches only
            # "v4.0.32-beta", rewriting it to "v4.0.33-beta" and keeping the 404.
            VER_RE='v[0-9]\+\.[0-9]\+\.[0-9]\+\(-[A-Za-z0-9.]\+\)*'
            sed -i "s|digibyte-wallet-${VER_RE}\.apk|${FILENAME}|g"              index.html
            sed -i "s|<div class=\"ver\">${VER_RE}|<div class=\"ver\">${TAG}|"   index.html
            sed -i "s|Download APK (${VER_RE})|Download APK (${TAG})|"           index.html
            sed -i "s|What's New in ${VER_RE}|What's New in ${TAG}|"             index.html
            sed -i "s|/releases/tag/${VER_RE}|/releases/tag/${TAG}|"             index.html
            sed -i "s|[a-f0-9]\{64\}|${HASH}|"                                   index.html

            # Point "latest" symlink at the new APK so
            # /downloads/digibyte-wallet-latest.apk always resolves to the most
            # recent STABLE release.
            ln -sf "/var/www/digiscope-downloads/${FILENAME}" digibyte-wallet-latest.apk

            # Publish the stable version AS DATA next to the binary.
            #
            # digiscope.me/wallet showed 4.0.46 while 4.0.55 was the live download, because
            # the page's version comes from a hand-maintained content file that only moves
            # when someone edits it. The APK updates itself every release; the number beside
            # it did not. A page that advertises the wrong version of a wallet is worse than
            # one that advertises none.
            #
            # Written only on the STABLE path, inside the same guard as the symlink, so a
            # prerelease can never advertise itself as current.
            printf '{"version":"%s","file":"%s","sha256":"%s","released":"%s"}\n' \
              "${TAG#v}" "$FILENAME" "$HASH" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > latest.json
            fi

            # Re-expose everything via the public downloads dir
            # (frontend deploys wipe symlinks).
            mkdir -p /var/www/digiscope/downloads
            ln -sf /var/www/digiscope-downloads/* /var/www/digiscope/downloads/
          DEPLOY
          echo "Deployed ${TAG} to digiscope.me/downloads/"
