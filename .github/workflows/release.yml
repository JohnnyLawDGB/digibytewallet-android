name: Release Build & Deploy

on:
  push:
    tags: ['v*']

jobs:
  build-sign-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: dgb-wallet-release
        run: ./gradlew :native:assembleMainnetRelease :app:assembleMainnetRelease

      - name: Compute SHA-256
        id: checksum
        run: |
          APK=$(find app/build/outputs/apk/mainnet/release -name '*.apk' | head -1)
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $HASH"

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.checksum.outputs.apk_path }}
          body: |
            **SHA-256:** `${{ steps.checksum.outputs.hash }}`

            Download from [digiscope.me/downloads/](https://digiscope.me/downloads/) or install the APK below. Requires Android 8.0+.
          prerelease: true

      - name: Deploy to VPS
        if: success()
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK_PATH="${{ steps.checksum.outputs.apk_path }}"
          APK_HASH="${{ steps.checksum.outputs.hash }}"
          FILENAME="digibyte-wallet-${TAG}-beta.apk"

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan digiscope.me >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key "$APK_PATH" "root@digiscope.me:/var/www/digiscope-downloads/${FILENAME}"

          ssh -i ~/.ssh/deploy_key root@digiscope.me bash -s "$TAG" "$FILENAME" "$APK_HASH" << 'DEPLOY'
            TAG="$1"; FILENAME="$2"; HASH="$3"
            cd /var/www/digiscope-downloads
            sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+-beta/${TAG}-beta/g" index.html
            sed -i "s/digibyte-wallet-v[0-9]\+\.[0-9]\+\.[0-9]\+-beta\.apk/${FILENAME}/g" index.html
            sed -i "s/[a-f0-9]\{64\}/${HASH}/" index.html
            mkdir -p /var/www/digiscope/downloads
            ln -sf /var/www/digiscope-downloads/* /var/www/digiscope/downloads/
          DEPLOY
          echo "Deployed ${TAG} to digiscope.me/downloads/"
