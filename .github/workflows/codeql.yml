# Compiled CodeQL for C/Kotlin. The previous setup used build-mode: none because
# CodeQL autobuild runs a bare `./gradlew assemble`, which builds every variant
# and ABI and dies in `:native`'s CMake generate step.
#
# This workflow keeps a buildless scan for GitHub Actions YAML, and traces a
# real compile for C and Kotlin using the same Gradle target CI already ships:
# `:app:assembleMainnetDebug` (includes the NDK native module).

name: "CodeQL Advanced"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '36 0 * * 3'
  workflow_dispatch:

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  analyze-compiled:
    name: Analyze (c-cpp, java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-codeql-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp,java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build (traced)
        run: ./gradlew :app:assembleMainnetDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
